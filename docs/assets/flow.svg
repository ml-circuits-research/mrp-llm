<svg xmlns="http://www.w3.org/2000/svg" width="380" height="435" viewBox="0 0 380 435" role="img" aria-labelledby="title description"><title id="title">Checked local circuit flow</title><desc id="description">User or local agent proposes SOP, the host validates it, memory and reasoning provide evidence, and CNL reports a checked result.</desc><defs><marker id="arrow" orient="auto" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"><path d="M0 0 L7 3.5 L0 7 Z" fill="#44647c"/></marker></defs><g font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" fill="#16364d"><rect x="45" y="10" width="290" height="72" rx="8" fill="#e8f2f5" stroke="#2e5e77" stroke-width="2"/><text x="190" y="40" font-weight="700">User or local agent</text><text x="190" y="63">Submits typed SOP</text><path d="M190 84 V110" stroke="#44647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="114" width="290" height="72" rx="8" fill="#e7f0dc" stroke="#5f7741" stroke-width="2"/><text x="190" y="144" font-weight="700">Host validation</text><text x="190" y="167">Checks policy and wires</text><path d="M190 188 V214" stroke="#44647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="218" width="290" height="76" rx="8" fill="#efeafa" stroke="#735a92" stroke-width="2"/><text x="190" y="248" font-weight="700">Memory and reasoning</text><text x="190" y="273">Select evidence and solve</text><path d="M190 296 V322" stroke="#44647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="326" width="290" height="72" rx="8" fill="#fff0dc" stroke="#916230" stroke-width="2"/><text x="190" y="356" font-weight="700">Checked result</text><text x="190" y="379">Evidence and CNL</text></g></svg>
